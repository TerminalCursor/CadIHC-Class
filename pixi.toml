[workspace]
channels = ["pytorch", "nvidia", "conda-forge"]
channel-priority = "disabled"
description = "Add a short description here"
name = "HistClass"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
train = {cmd = "python3 scripts/TrainModel.py"}

[system-requirements]
cuda = "12.5"

[dependencies]
python = ">=3.13,<3.14"
pip = "*"
pytorch = ">=2.12.1,<3"
torchvision = ">=0.28.0,<0.29"
numpy = ">=2.5.1,<3"
matplotlib = ">=3.11.0,<4"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.3,<4"
tqdm = ">=4.68.4,<5"
pyright = ">=1.1.411,<2"
scikit-learn = ">=1.9.0,<2"
black = ">=26.5.1,<27"
pytest = ">=9.1.1,<10"
pandera = ">=0.32.1,<0.33"
paramiko = ">=5.0.0,<6"
python-dotenv = ">=1.2.2,<2"

[pypi-dependencies]
histclass = { path =  '.', editable = true }
opencv-python = ">=4.11.0.86, <5"

