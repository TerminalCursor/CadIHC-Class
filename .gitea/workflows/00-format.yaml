name: Format Python Source
run-name: 🧹 Cleaning up formatting
on:
  push:
    branches:
      - master
      - tests
  pull:
    types: [open, edited, synchronize]
    branches:
      - master
      - tests

jobs:
  Format-Python-Source:
    runs-on: ubuntu-base
    container:
      image: custom-runner:latest
    steps:
      - name: Checking out
        uses: actions/checkout@v4
      - name: Install and run black formatter
        # Use a specific version or @stable as recommended in the Black documentation
        uses: psf/black@stable
        id: black
        with:
          # This action will format the code in place
          options: "--verbose src tests"
      - name: Commit changes if any
        # Use the git-auto-commit-action to commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Commit message for the automatic changes
          commit_message: "Fix formatting with black"
          # Files to include in the commit (optional, defaults to all changes)
          files: "**/*.py"
