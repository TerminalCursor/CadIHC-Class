[project]
authors = [{name = "Christian Cunningham", email = "cc@local.lan"}]
dependencies = []
name = "CadIHC-Class"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
histclass = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
  "tests",
]
